server:
  port: 8081
spring:
  application:
    name: SERVICE-CLIENT
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/clientservicedb?createDatabaseIfNotExist=true}"
    username: "${DB_USER:root}"
    password: "${DB_PASSWORD:}"
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: "${EUREKA_URL:http://localhost:8761/eureka/}"
  instance:
    prefer-ip-address: true
    ip-address: "${EUREKA_INSTANCE_IP:127.0.0.1}"
